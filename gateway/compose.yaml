x-runner:
  port: 18278
  replicas: 3
services:
  app:
    build: .
    ports: ["18278:18278"]
    environment:
      DOMAIN: ${DOMAIN}
      STATUS_URL: ${STATUS_URL}
      ROUTES_FALLBACK: ${ROUTES_FALLBACK}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18278/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
  shared-connector:
    build: .
    command: ["node", "connector.mjs"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:20241/metrics').then(r=>r.text()).then(t=>process.exit(/^cloudflared_tunnel_ha_connections\\s+[1-9]/m.test(t)?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20s
