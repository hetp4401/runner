[workspace]
members = ["runner-core", "runner-raft", "runner-agent", "runner-control"]
resolver = "2"
exclude = ["vendor/raft-proto"]

[patch.crates-io]
# etcd uses 3 for AddLearnerNode; upstream raft-rs uses 2 (etcd UpdateNode).
# Keeping the existing fleet's wire format permits a tested rolling migration.
raft-proto = { path = "vendor/raft-proto" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
hmac = "0.12"
libc = "0.2"
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
protobuf = "2.28"
raft = { version = "0.7", default-features = false, features = ["protobuf-codec"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
serde_yaml = "0.9"
sha2 = "0.10"
slog = "2"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "signal", "fs", "io-util", "process"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
