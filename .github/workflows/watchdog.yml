name: watchdog

# Observe controller health. Providers supply servers without CP capacity targets.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: watchdog

permissions:
  contents: read

jobs:
  watchdog:
    if: ${{ vars.CONTROL_URL != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check controller health
        shell: bash
        env:
          CONTROL_URL: ${{ vars.CONTROL_URL }}
        run: |
          curl -fsS --max-time 20 --retry 3 "$CONTROL_URL/api/status" |
            jq -e '.fleetMode == "passive" and (.groups | type == "array")' >/dev/null
          echo "Controller is accepting tagged servers."
